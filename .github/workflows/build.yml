name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/lua_runtime_mod-*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release tag
        id: latest
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download JAR
        if: steps.latest.outputs.tag != format('v{0}', steps.version.outputs.version)
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: build/libs/

      - name: Create release
        if: steps.latest.outputs.tag != format('v{0}', steps.version.outputs.version)
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/libs/lua_runtime_mod-${{ steps.version.outputs.version }}.jar" \
            --title "Lua Runtime Mod v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
